schema_version = "1.0.0"
id = "sprite3d_mesh_io"
version = "1.4.4"
name = "Sprite3D Mesh Import Export"
tagline = "Edit headerless Sprite3D triangle meshes directly in Blender"
maintainer = "Sprite3D Tools"
type = "add-on"
tags = ["Import-Export"]
blender_version_min = "5.0.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Read/write selected Sprite3D files and create overwrite backups"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".git/", "*.zip"]
